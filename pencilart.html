<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customize Your Shirt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background-color: #fff;
      display: flex;
      gap: 40px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
    }

    .shirt-image {
      flex: 1;
      text-align: center;
    }

    .shirt-image img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .form-area {
      flex: 1;
    }

    .form-area h2 {
      text-align: left;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .cart-btn {
      width: 100%;
      padding: 14px;
      background-color: #dff700;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .cart-btn:hover {
      background-color: #c3e000;
    }

    .color-options {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
      position: relative;
    }

    .color-swatch input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .color-swatch input[type="radio"]:checked + span {
      border: 2px solid #000;
      box-shadow: 0 0 0 2px #dff700;
    }

    .color-swatch span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px;
      }

      .shirt-image,
      .form-area {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Shirt Image -->
    <div class="shirt-image">
      <img src="images/formal-shirt-sample.jpg" alt="Formal Shirt">
    </div>

    <!-- Form -->
    <div class="form-area">
      <h2>Customize Your Formal Shirt</h2>
      <form>
        <!-- Collar Type -->
        <div class="form-group">
          <label for="collar">Collar Type</label>
          <select id="collar" name="collar">
            <option>Spread</option>
            <option>Point</option>
            <option>Cutaway</option>
            <option>Button-Down</option>
            <option>Mandarin</option>
          </select>
        </div>

        <!-- Fit Type -->
        <div class="form-group">
          <label for="fit">Fit</label>
          <select id="fit" name="fit">
            <option>Slim Fit</option>
            <option>Regular Fit</option>
            <option>Athletic Fit</option>
            <option>Relaxed Fit</option>
          </select>
        </div>

        <!-- Cuff Type -->
        <div class="form-group">
          <label for="cuff">Cuff Type</label>
          <select id="cuff" name="cuff">
            <option>Button Cuff</option>
            <option>French Cuff</option>
            <option>Convertible Cuff</option>
          </select>
        </div>

        <!-- Fabric -->
        <div class="form-group">
          <label for="fabric">Fabric</label>
          <select id="fabric" name="fabric">
            <option>Cotton</option>
            <option>Linen</option>
            <option>Silk</option>
            <option>Blended</option>
          </select>
        </div>

        <!-- Pattern -->
        <div class="form-group">
          <label for="pattern">Pattern</label>
          <select id="pattern" name="pattern">
            <option>Solid</option>
            <option>Striped</option>
            <option>Checked</option>
            <option>Textured</option>
          </select>
        </div>

        <!-- Shirt Color -->
        <div class="form-group">
          <label>Color</label>
          <div class="color-options">
            <label class="color-swatch">
              <input type="radio" name="shirtColor" value="White">
              <span style="background-color: white;"></span>
            </label>
            <label class="color-swatch">
              <input type="radio" name="shirtColor" value="Light Blue">
              <span style="background-color: lightblue;"></span>
            </label>
            <label class="color-swatch">
              <input type="radio" name="shirtColor" value="Gray">
              <span style="background-color: gray;"></span>
            </label>
            <label class="color-swatch">
              <input type="radio" name="shirtColor" value="Black">
              <span style="background-color: black;"></span>
            </label>
            <label class="color-swatch">
              <input type="radio" name="shirtColor" value="Pink">
              <span style="background-color: pink;"></span>
            </label>
          </div>
        </div>

        <!-- Add to Cart -->
        <button type="button" class="cart-btn">Add to Cart</button>
      </form>
    </div>
  </div>

</body>
</html>

<script>
    function openImage(imgElement) {
        const modal = document.getElementById("imageModal");
        const fullImage = document.getElementById("fullImage");

        fullImage.src = imgElement.src; // Set the clicked image as the modal content
        modal.style.display = "flex"; // Show the modal
    }

    function closeImage() {
        const modal = document.getElementById("imageModal");
        modal.style.display = "none"; // Hide the modal
    }
</script>
