<section class="appointment-section">
    <div class="container">
      <h2>Book an Appointment</h2>
      <form id="appointmentForm">
        
        <!-- Category Selection -->
        <label for="category">Select Category</label>
        <select id="category" name="category" required>
          <option value="">-- Select --</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
        </select>
  
        <!-- Material Selection -->
        <label for="material">Choose Material</label>
        <select id="material" name="material" required>
          <option value="">-- Select --</option>
          <option value="Cotton">Cotton</option>
          <option value="Linen">Linen</option>
          <option value="Silk">Silk</option>
          <option value="Polyester">Polyester</option>
        </select>
  
        <!-- Clothing Type -->
        <label for="type">Select Clothing Type</label>
        <select id="type" name="type" required onchange="showSizeOptions(this.value)">
          <option value="">-- Select --</option>
          <option value="Shirt">Shirt</option>
          <option value="Pants">Pants</option>
          <option value="Dress">Dress</option>
          <option value="Uniform">Uniform</option>
          <option value="Party Dress">Party Dress</option>
        </select>
  
        <!-- Size/Measurement for Shirt -->
        <div id="shirtOptions" style="display: none;">
          <label for="size">Choose Shirt Size</label>
          <select id="size" name="size">
            <option value="">-- Select Size --</option>
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
            <option value="XL">XL</option>
          </select>
  
          <p>Or enter custom measurements:</p>
          <label>Chest (inches)</label>
          <input type="number" name="chest" placeholder="e.g. 38">
  
          <label>Shirt Length (inches)</label>
          <input type="number" name="length" placeholder="e.g. 28">
        </div>
  
        <!-- Submit Button -->
        <button type="submit">Book Appointment</button>
      </form>
    </div>
  </section>
