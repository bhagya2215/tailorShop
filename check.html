<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - JR Tailors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .checkout-header h1 {
            color: #333;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .billing-section, .payment-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .payment-methods {
            margin-top: 20px;
        }

        .payment-method {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-method:hover {
            border-color: #ffd700;
        }

        .payment-method.active {
            border-color: #ffd700;
            background-color: #fffdf5;
        }

        .payment-method i {
            font-size: 1.5rem;
            margin-right: 15px;
            color: #555;
        }

        .payment-method.active i {
            color: #ffd700;
        }

        .payment-method-details {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .payment-method-details.active {
            display: block;
        }

        .order-summary {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .order-items {
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item-name {
            flex: 2;
        }

        .order-item-quantity {
            flex: 1;
            text-align: center;
        }

        .order-item-price {
            flex: 1;
            text-align: right;
        }

        .order-totals {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .order-total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .order-total-row.total {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #ffd700;
            color: #333;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .place-order-btn:hover {
            background: #e6c200;
        }
        .download-btn {
         width: 100%;
         padding: 15px;
         background: #4CAF50;
         color: white;
         border: none;
         border-radius: 5px;
         font-size: 1.1rem;
         font-weight: 600;
         cursor: pointer;
         transition: all 0.3s;
         margin-top: 10px;
}

.download-btn:hover {
    background: #45a049;
}
.empty-cart-message {
    text-align: center;
    margin-top: 30px;
    font-size: 1.2rem;
    color: #666;
}

.empty-cart-message a {
    color: #ffd700;
    text-decoration: none;
    font-weight: bold;
}

.empty-cart-message a:hover {
    text-decoration: underline;
}
        @media (max-width: 768px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <p>Complete your purchase</p>
        </div>

        <div class="checkout-grid">
            <div class="billing-payment">
                <section class="billing-section">
                    <h2 class="section-title">Billing Details</h2>
                    <form id="billing-form">
                        <div class="row">
                            <div class="form-group">
                                <label for="first-name">First Name</label>
                                <input type="text" id="first-name" required>
                            </div>
                            <div class="form-group">
                                <label for="last-name">Last Name</label>
                                <input type="text" id="last-name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Street Address</label>
                            <input type="text" id="address" required>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" required>
                            </div>
                            <div class="form-group">
                                <label for="zip">ZIP Code</label>
                                <input type="text" id="zip" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="country">Country</label>
                            <select id="country" required>
                                <option value="">Select Country</option>
                                <option value="Sri Lanka">Sri Lanka</option>
                                <option value="India">India</option>
                                <option value="USA">United States</option>
                                <option value="UK">United Kingdom</option>
                            </select>
                        </div>
                    </form>
                </section>

                <section class="payment-section">
                    <h2 class="section-title">Payment Method</h2>
                    <div class="payment-methods">
                        <div class="payment-method active" data-method="card">
                            <i class="far fa-credit-card"></i>
                            <div>
                                <h4>Credit/Debit Card</h4>
                                <p>Pay securely with your card</p>
                            </div>
                        </div>
                        <div class="payment-method-details active" id="card-details">
                            <div class="form-group">
                                <label for="card-number">Card Number</label>
                                <input type="text" id="card-number" placeholder="1234 5678 9012 3456">
                            </div>
                            <div class="row">
                                <div class="form-group">
                                    <label for="expiry">Expiry Date</label>
                                    <input type="text" id="expiry" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" placeholder="123">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="card-name">Name on Card</label>
                                <input type="text" id="card-name">
                            </div>
                        </div>

                        <div class="payment-method" data-method="paypal">
                            <i class="fab fa-paypal"></i>
                            <div>
                                <h4>PayPal</h4>
                                <p>Pay with your PayPal account</p>
                            </div>
                        </div>

                        <div class="payment-method" data-method="cod">
                            <i class="fas fa-money-bill-wave"></i>
                            <div>
                                <h4>Cash on Delivery</h4>
                                <p>Pay when you receive your order</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="order-summary">
                <h2 class="section-title">Your Order</h2>
                <div class="order-items" id="order-items">
                    <!-- Order items will be inserted here by JavaScript -->
                </div>
                <div class="order-totals">
                    <div class="order-total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">Rs. 0.00</span>
                    </div>
                    <div class="order-total-row">
                        <span>Shipping:</span>
                        <span id="shipping">Rs. 200.00</span>
                    </div>
                    <div class="order-total-row">
                        <span>Tax:</span>
                        <span id="tax">Rs. 0.00</span>
                    </div>
                    <div class="order-total-row total">
                        <span>Total:</span>
                        <span id="total">Rs. 0.00</span>
                    </div>
                </div>
                <button class="place-order-btn" id="place-order">Place Order</button>
                <button class="download-btn" id="download-pdf">Download Bill as PDF</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load cart and totals from localStorage
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const savedTotals = JSON.parse(localStorage.getItem('cartTotals')) || {
                subtotal: 7030,
                shipping: 200,
                tax: 0,
                total: 0
            };
            
            // Display order items
            const orderItemsContainer = document.getElementById('order-items');
            let subtotal = 0;
            
            if (cart.length === 0) {
                orderItemsContainer.innerHTML = '<p class="empty-cart">Your cart is empty</p>';
                document.querySelector('.checkout-actions').style.display = 'none';
            } else {
                cart.forEach(item => {
                    const itemTotal = parseFloat((item.price * item.quantity).toFixed(2));
                    subtotal += itemTotal;
                    
                    const orderItem = document.createElement('div');
                    orderItem.className = 'order-item';
                    orderItem.innerHTML = `
                        <div class="order-item-name">${item.name}</div>
                        <div class="order-item-quantity">${item.quantity}</div>
                        <div class="order-item-price">Rs. ${itemTotal.toLocaleString('en-IN')}</div>
                    `;
                    orderItemsContainer.appendChild(orderItem);
                });
            }
    
            // Use the saved totals if available, otherwise calculate new ones
            const { subtotal: savedSubtotal, shipping, tax, total } = savedTotals;
            
            // If we have items in cart but no saved totals, calculate fresh
            const finalSubtotal = cart.length > 0 && savedSubtotal === 0 ? 
                parseFloat(subtotal.toFixed(2)) : savedSubtotal;
            const finalTax = cart.length > 0 && tax === 0 ? 
                parseFloat((finalSubtotal * 0.12).toFixed(2)) : tax;
            const finalTotal = cart.length > 0 && total === 0 ? 
                parseFloat((finalSubtotal + shipping + finalTax).toFixed(2)) : total;
            
            // Update the DOM with formatted totals
            document.getElementById('subtotal').textContent = `Rs. ${finalSubtotal.toLocaleString('en-IN')}`;
            document.getElementById('shipping').textContent = `Rs. ${shipping.toLocaleString('en-IN')}`;
            document.getElementById('tax').textContent = `Rs. ${finalTax.toLocaleString('en-IN')}`;
            document.getElementById('total').textContent = `Rs. ${finalTotal.toLocaleString('en-IN')}`;
    
            // PDF Generation
            document.getElementById('download-pdf').addEventListener('click', function() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Header
                doc.setFontSize(22);
                doc.setTextColor(40);
                doc.text('JR Tailors - Invoice', 105, 20, { align: 'center' });
                
                // Store Info
                doc.setFontSize(12);
                doc.setTextColor(100);
                doc.text('150/A, Kiribathkumbura, Kandy, Sri Lanka', 105, 30, { align: 'center' });
                doc.text('Phone: +94 77 123 4567 | Email: info@jrtailors.com', 105, 36, { align: 'center' });
                
                // Customer Information
                doc.setDrawColor(200);
                doc.line(20, 42, 190, 42);
                doc.setFontSize(14);
                doc.setTextColor(40);
                doc.text('Billing Information', 20, 50);
                
                doc.setFontSize(10);
                const firstName = document.getElementById('first-name').value || 'Not provided';
                const lastName = document.getElementById('last-name').value || 'Not provided';
                const email = document.getElementById('email').value || 'Not provided';
                const phone = document.getElementById('phone').value || 'Not provided';
                const address = document.getElementById('address').value || 'Not provided';
                
                doc.text(`Name: ${firstName} ${lastName}`, 20, 60);
                doc.text(`Email: ${email}`, 20, 66);
                doc.text(`Phone: ${phone}`, 20, 72);
                doc.text(`Address: ${address}`, 20, 78);
                
                // Order Details
                doc.setFontSize(14);
                doc.text('Order Details', 20, 90);
                
                // Create table data with consistent formatting
                const items = cart.map(item => [
                    item.name,
                    item.quantity,
                    `Rs. ${item.price.toFixed(2)}`,
                    `Rs. ${(item.price * item.quantity).toFixed(2)}`
                ]);
                
                // Add totals to table
                items.push([
                    { content: 'Subtotal:', colSpan: 3, styles: { fontStyle: 'bold' } },
                    `Rs. ${finalSubtotal.toFixed(2)}`
                ]);
                items.push([
                    { content: 'Shipping:', colSpan: 3 },
                    `Rs. ${shipping.toFixed(2)}`
                ]);
                items.push([
                    { content: 'Tax (12%):', colSpan: 3 },
                    `Rs. ${finalTax.toFixed(2)}`
                ]);
                items.push([
                    { content: 'Total:', colSpan: 3, styles: { fontStyle: 'bold' } },
                    { content: `Rs. ${finalTotal.toFixed(2)}`, styles: { fontStyle: 'bold' } }
                ]);
                
                // Generate table
                doc.autoTable({
                    startY: 95,
                    head: [['Item', 'Qty', 'Unit Price', 'Total']],
                    body: items,
                    theme: 'grid',
                    headStyles: {
                        fillColor: [70, 130, 180],
                        textColor: 255,
                        fontStyle: 'bold'
                    },
                    styles: {
                        fontSize: 10,
                        cellPadding: 3
                    }
                });
                
                // Footer
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text('Thank you for your purchase!', 105, doc.lastAutoTable.finalY + 15, { align: 'center' });
                
                // Save PDF
                const date = new Date();
                const invoiceNumber = `INV-${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2, '0')}${date.getDate().toString().padStart(2, '0')}-${Math.floor(Math.random() * 1000)}`;
                doc.save(`JR_Tailors_Invoice_${invoiceNumber}.pdf`);
            });
    
            // Payment method selection
            const paymentMethods = document.querySelectorAll('.payment-method');
            const paymentDetails = document.querySelectorAll('.payment-method-details');
            
            paymentMethods.forEach(method => {
                method.addEventListener('click', function() {
                    // Remove active class from all methods
                    paymentMethods.forEach(m => m.classList.remove('active'));
                    paymentDetails.forEach(d => d.classList.remove('active'));
                    
                    // Add active class to selected method
                    this.classList.add('active');
                    const methodType = this.getAttribute('data-method');
                    document.getElementById(`${methodType}-details`).classList.add('active');
                });
            });
            
            // Place order button
            document.getElementById('place-order').addEventListener('click', function() {
                // Validate form
                const form = document.getElementById('billing-form');
                const inputs = form.querySelectorAll('input[required], select[required]');
                let isValid = true;
                
                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        input.style.borderColor = 'red';
                        isValid = false;
                    } else {
                        input.style.borderColor = '#ddd';
                    }
                });
                
                if (!isValid) {
                    alert('Please fill in all required fields');
                    return;
                }
                
                // Process order
                alert('Order placed successfully! Thank you for your purchase.');
                
                // Clear cart and totals
                localStorage.removeItem('cart');
                localStorage.removeItem('cartTotals');
                
                // Redirect to thank you page
                window.location.href = "thankyou.html";
            });
        });
    </script>
    
    <style>
        .empty-cart {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .checkout-actions {
            margin-top: 30px;
        }
        
        input:invalid, select:invalid {
            border-color: #ff6b6b;
        }
    </style>
</body>
</html>
